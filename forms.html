<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="index.php">
        <label for="username">username:</label>
        <input id="username" type="text" required minlength="6" maxlength="12" placeholder="Spongebob">
        <br>
        <label for="password">password:</label>
        <input type="password" id="password" type="text" required minlength="6" maxlength="30" placeholder="Please no 12345">
        <br>
        <label for="email">email:</label>
        <input type="email" id="email">
        <br>
        <input type="tel" id="phone" placeholder="Phone number here" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
        <br>
        <input type="reset"> 
        <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
