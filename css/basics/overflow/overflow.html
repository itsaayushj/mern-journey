        overflow = property that sets the desired behaviour when content 
        does not fit in the parent element box (overflows) 
overflow : visible // overflow is visible
overflow : hidden // overflow text is completely hidden

                    with the help of overflow-clip-margin
overflow : scroll // adds a scroll bar 
overflow : auto // adds a scroll bar only when needed
